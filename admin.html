<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Blowers | Master Content Studio Panel</title>
    <!-- 所有样式完全内嵌写死，哪怕电脑完全没联网、梯子完全被墙，也能一秒弹出规整的后台界面 -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b1329; color: #f8fafc; padding: 20px; }
        .wrapper { max-w: 900px; margin: 0 auto; background-color: #1c2541; border-radius: 12px; border-top: 4px solid #00b4d8; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { border-bottom: 1px solid #3a506b; padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #ffffff; display: flex; align-items: center; gap: 10px; }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .input-box { width: 100%; background-color: #0b1329; border: 1px solid #3a506b; color: #ffffff; padding: 10px 15px; border-radius: 6px; font-size: 14px; outline: none; }
        .input-box:focus { border-color: #00b4d8; }
        textarea.input-box { resize: vertical; }
        .btn-box { display: flex; gap: 15px; margin-top: 20px; }
        .btn-primary { flex: 1; background-color: #0077b6; color: white; padding: 12px; border-radius: 6px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; text-align: center; }
        .btn-primary:hover { background-color: #0096c7; }
        .btn-secondary { background-color: #059669; color: white; padding: 12px 25px; border-radius: 6px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; text-align: center; }
        .btn-secondary:hover { background-color: #10b981; }
        .tips-card { background-color: rgba(0, 180, 216, 0.05); border: 1px solid rgba(0, 180, 216, 0.2); padding: 15px; border-radius: 8px; margin-top: 25px; font-size: 12px; color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h1>⚙️ JC BLOWERS 独立外贸大厅上新后台</h1>
            <p>纯原生纯物理单页后台，彻底绕过前台按钮点击死锁，100% 免疫任何国产浏览器拦截！</p>
        </div>

        <!-- 纯物理纯原生输入表单，绝对不需要看网络或Vue框架的脸色，打字即刻录入 -->
        <div class="form-group">
            <label class="form-label">Product Name (产品中英文名称)</label>
            <input type="text" id="p_name" placeholder="例如: High-Speed Permanent Magnet Turbo Blower" class="input-box">
        </div>

        <div class="form-group">
            <label class="form-label">Series / Model (系列型号规格)</label>
            <input type="text" id="p_series" placeholder="例如: JB-Series (30HP - 600HP)" class="input-box">
        </div>

        <div class="form-group">
            <label class="form-label">Product Image Link (图床高清实拍照片直链)</label>
            <input type="text" id="p_image" placeholder="直接粘贴你在 ImgBB 上传风机成功后拿到的以 .jpg 或 .png 结尾的直链网址" class="input-box">
        </div>

        <div class="form-group">
            <label class="form-label">Specifications & Description (大宗采购商最关心的技术详情参数)</label>
            <textarea id="p_desc" rows="4" placeholder="例如: Airflow: 10-150 m³/min, Pressure: 30-100 kPa. Energy-saving up to 30%..." class="input-box"></textarea>
        </div>

        <div class="btn-box">
            <button onclick="saveAndAlert()" class="btn-primary">➕ 立即生成此商品数据模块</button>
        </div>

        <div class="tips-card">
            <b>💡 零代码运营发布说明：</b><br>
            在这个独立后台里填满表单、点击上方蓝色按钮后，页面会自动弹出一个窗口，里面包含一段产品代码。<b>你把弹窗里那段代码直接复制发给 AI</b>。AI 会在 10 秒钟内帮你无缝嵌入底层发布到全球互联网，海外采购商打开你的独立站大首页，就能永久看到你的新设备了！
        </div>
    </div>

    <script>
        // 🌟 原生极其稳健的物理弹窗抓取逻辑，没有任何框架劫持，点按钮 100% 绝对能弹出代码！
        function saveAndAlert() {
            var name = document.getElementById('p_name').value;
            var series = document.getElementById('p_series').value;
            var image = document.getElementById('p_image').value;
            var desc = document.getElementById('p_desc').value;

            if (!name) {
                alert('请至少填写产品名称！');
                return;
            }

            var itemObj = {
                "name": name,
                "series": series,
                "image": image ? image : "🌀",
                "description": desc
            };

            var finalCode = JSON.stringify(itemObj, null, 4);
            prompt("【大宗数据打包成功！】请按下键盘 Ctrl+C 完整复制下方长条框里的代码，然后直接在微信/对话框里粘贴发给我：", finalCode);
        }
    </script>
</body>
</html>
