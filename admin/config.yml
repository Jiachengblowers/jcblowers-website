# 后台配置核心文件
backend:
  name: git-gateway
  branch: main # 对应你 GitHub 的分支，默认一般是 main

# 媒体图片存放路径（会自动在本地创建 images 文件夹）
media_folder: "images"
public_folder: "/images"

# 定义你在后台可以修改哪些板块
collections:
  - name: "products"
    label: "Product Matrix (产品管理)"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name (产品名称)", name: "title", widget: "string"}
      - {label: "Category (产品分类)", name: "category", widget: "select", options: ["Turbo Blowers", "Air-Bearing Blowers", "Maglev Turbo Blowers", "Air Knife Systems"]}
      - {label: "Product Image (产品图片)", name: "image", widget: "image"}
      - {label: "Specifications & Description (产品描述与技术参数)", name: "body", widget: "markdown"}
